


<h4>{tmpl_var name='plugin_acmeapi_key_txt'}</h4><br>
{tmpl_if name='plugin_acmeapi_key'}
<pre>{tmpl_var name='plugin_acmeapi_key'}</pre>
<hr>
<button class="btn btn-default formbutton-success" type="button" value="{tmpl_var name='btn_delete_txt'}" data-submit-form="pageForm" data-form-action="dns/dns_soa_edit.php?acmetask=delete&next_tab=plugin_acmeapi">{tmpl_var name='plugin_acmeapi_key_delete_key_txt'}</button>

{tmpl_else}
<pre>{tmpl_var name='plugin_acmeapi_key_unavailable_txt'}</pre>
<hr>
<button class="btn btn-default formbutton-success" type="button" value="{tmpl_var name='btn_save_txt'}" data-submit-form="pageForm" data-form-action="dns/dns_soa_edit.php?id={tmpl_var name='id'}&next_tab=plugin_acmeapi&acmetask=create">{tmpl_var name='plugin_acmeapi_key_create_key_txt'}</button>
{/tmpl_if}
<input type="hidden" name="id" value="{tmpl_var name='id'}">
<input type="hidden" name="acmetab" value="yes">

<div class="clear">
    <div class="right">
        <button class="btn btn-default formbutton-default" type="button" value="{tmpl_var name='btn_cancel_txt'}" data-load-content="dns/dns_soa_list.php">Exit</button>
    </div>
</div>
